# ============================================================================
# EXPERIMENT C, ARM 1 of 3: control. The existing conditioner, continued training.
#
# This arm changes NOTHING about the model. It exists because all three arms train
# for additional steps from the same parent, so any gain the pairwise arms show has
# to beat continued training rather than the parent checkpoint. Our matched control
# at this budget scored native QED MAE 0.1922, raw validity 13.8%, valid target-hit
# yield 30.4% on confirmation; those are the numbers to beat.
#
# Driven by scripts/45_train_bond_arm.py --arm control. The three arms share the
# parent checkpoint, step budget, learning rate, seed, data directory and decoder;
# only `arm` differs across these three files.
# ============================================================================

experiment: C_bond_pairwise
arm: control

parent:
  # the SAME parent for all three arms
  checkpoint: outputs/checkpoints/flow_nqed_ae128_qedcontrast/seed_3/best.pt
  autoencoder: outputs/ablation/ae_degree_128d/seed_3/last.pt
  data_dir: data/processed/zinc250k_charge_aware_moflow_fixed

architecture:
  bond_aware_coupling: false     # the parent's architecture, untouched
  bond_pair_dim: null            # not applicable

objective:
  bond_loss_weight: 0.0          # no auxiliary term

training:
  screening_steps: 3000          # additional optimizer steps; step resets to 0
  learning_rate: 1.0e-5
  warmup_steps: 100
  batch_size: 128
  seed: 3
  eval_every: 500
  save_every: 500
  val_molecules: 5000
  early_stopping_patience: null  # experiment-local; the budget is fixed, not adaptive

selection:
  criterion: validation likelihood
  note: >
    best.pt is chosen on the validation NLL alone in every arm, including the
    supervised one. An auxiliary objective must not be able to buy a better
    checkpoint by changing what "better" means.
