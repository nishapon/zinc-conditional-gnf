[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zinc-conditional-gnf"
version = "0.2.0"
description = "Conditional graph normalizing flow for ZINC250K molecular generation"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Nisha Ponnambalam" },
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "PyYAML>=6.0",
    "tqdm>=4.65",
    "networkx>=3.1",
    "rdkit>=2023.9",
    "torch>=2.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["zinc_gnf*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
